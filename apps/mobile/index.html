<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2b64" />
  <title>EazInvoice Android</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-signed-in="false" data-busy="false">
  <div id="offlineBanner" class="system-banner" hidden>Offline. Financial posting is blocked until the app reconnects.</div>
  <div id="installRisk" class="system-banner warning" hidden>Development API endpoint. Release builds must use HTTPS.</div>

  <main class="mobile-shell">
    <header class="top-app-bar">
      <div class="brand-lockup">
        <img src="./assets/logo-icon.png" alt="" />
        <div>
          <span id="routeTitle">Home</span>
          <strong>EazInvoice</strong>
        </div>
      </div>
      <button id="refreshButton" class="icon-action" type="button" aria-label="Refresh workspace" hidden>↻</button>
    </header>

    <section class="workspace-bar" aria-label="Current business workspace">
      <div>
        <strong id="profileName">Not signed in</strong>
        <span id="profileMeta">Configure API and sign in</span>
      </div>
      <select id="workspaceSelect" aria-label="Switch business" hidden></select>
      <button id="logoutButton" class="text-action" type="button" hidden>Logout</button>
    </section>

    <form id="apiBaseForm" class="endpoint-form">
      <label>
        <span>API</span>
        <input id="apiBase" name="apiBase" inputmode="url" autocomplete="url" />
      </label>
      <button class="secondary compact" type="submit">Save</button>
    </form>

    <div id="status" class="status-line" role="status" aria-live="polite"></div>

    <section id="content" class="content-area"></section>

    <nav id="bottomNav" class="bottom-nav" aria-label="Primary mobile navigation">
      <button class="active" type="button" data-route="home">Home</button>
      <button type="button" data-route="sales">Sales</button>
      <button type="button" data-route="purchases">Purchases</button>
      <button type="button" data-route="money">Money</button>
      <button type="button" data-route="reports">Reports</button>
      <button type="button" data-route="more">More</button>
    </nav>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
